name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            cd /opt/cocos-partner

            # Не затираем правки, сделанные прямо на сервере
            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "На сервере есть незакоммиченные изменения, деплой остановлен:"
              git status --short --untracked-files=no
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main

            compose="docker compose -f docker-compose.prod.yml"

            # Запоминаем рабочий образ на случай отката
            docker image tag cocos-partner-app:latest cocos-partner-app:previous || true

            # Старая версия работает, пока собирается новая
            $compose build app
            $compose up -d app

            ok=0
            for i in $(seq 1 45); do
              if curl -fsS -m 5 http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                ok=1
                break
              fi
              sleep 2
            done

            if [ "$ok" != 1 ]; then
              $compose logs --tail 80 app
              docker image tag cocos-partner-app:previous cocos-partner-app:latest
              $compose up -d --no-build app
              echo "Новая версия не запустилась, возвращена предыдущая"
              exit 1
            fi

            # Чистим старые образы и кэш сборки старше недели
            docker image prune -f
            docker builder prune -f --filter until=168h
            echo "Деплой выполнен: $(git log -1 --format='%h %s')"
